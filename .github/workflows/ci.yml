name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Qt needs these even under the offscreen platform plugin: it still links
      # libGL/libEGL, and QGuiApplication touches xkbcommon and dbus on startup.
      # A GitHub runner image carries none of them.
      - name: Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libglib2.0-0

      # The gui extra is not optional here. mypy checks `src/rotorid`, which
      # includes the GUI, so without PySide6 installed every Qt import is an
      # error -- and every GUI test quietly importorskips itself away. Installing
      # it is what makes both of those checks real.
      - name: Install
        run: python -m pip install -e ".[gui,dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Format check
        run: python -m ruff format --check src tests

      - name: Type check
        run: python -m mypy

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest
